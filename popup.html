<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fab Seller Blocklist</title>
<style>
  [hidden] { display: none !important; }
  #error { color: #ffb3b3; }
  :root { color-scheme: dark; }
  body { width: 320px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; background: #1b1b1f; color: #eee; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  h1.section { margin-top: 14px; }
  .row { display: flex; gap: 6px; margin-bottom: 10px; }
  input[type=text] { flex: 1; padding: 6px 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: #eee; }
  button { padding: 6px 10px; border-radius: 4px; border: 1px solid #555; background: #2a2a30; color: #eee; cursor: pointer; }
  button:hover { background: #3a3a42; }
  button.danger:hover { background: #6a2020; border-color: #a33; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow: auto; border: 1px solid #333; border-radius: 4px; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-bottom: 1px solid #2a2a2a; }
  li:last-child { border-bottom: 0; }
  li button { padding: 2px 8px; font-size: 11px; }
  .empty { padding: 12px; color: #888; text-align: center; justify-content: center; }
  .footer { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .footer button { flex: 1; font-size: 12px; }
  #current { margin-bottom: 10px; padding: 8px; background: #26262c; border-radius: 4px; display: none; }
  #current.show { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .muted { color: #999; font-size: 11px; }
  .option { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: #ccc; cursor: pointer; }
  .option input { margin: 0; }
  textarea { width: 100%; height: 120px; box-sizing: border-box; margin-top: 8px; background: #111; color: #eee; border: 1px solid #444; border-radius: 4px; font: 12px monospace; }
</style>
</head>
<body>
  <p id="error" role="alert" hidden></p>
  <h1>Blocked sellers <span id="count" class="muted"></span></h1>

  <div id="current">
    <span>This page: <strong id="currentName"></strong></span>
    <button id="currentBtn"></button>
  </div>

  <div class="row">
    <input type="text" id="addInput" placeholder="Seller name, exactly as shown on Fab">
    <button id="addBtn">Add</button>
  </div>

  <ul id="list"></ul>

  <h1 class="section">Blocked keywords <span id="kwCount" class="muted"></span></h1>
  <div class="row">
    <input type="text" id="kwInput" placeholder="Hide listings whose title contains...">
    <button id="kwAddBtn">Add</button>
  </div>
  <ul id="kwList"></ul>

  <label class="option">
    <input type="checkbox" id="reloadToggle">
    Reload the page after blocking or unblocking
  </label>

  <div class="footer">
    <button id="importBtn">Import</button>
    <button id="exportBtn">Export</button>
    <button id="clearBtn" class="danger">Clear all</button>
  </div>
  <textarea id="io" placeholder="One seller per line. Prefix keywords with kw: (e.g. kw:metahuman)" hidden></textarea>
  <div class="footer" id="ioActions" hidden>
    <button id="ioApply">Apply</button>
    <button id="ioCancel">Cancel</button>
  </div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
